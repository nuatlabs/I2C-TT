# Tiny Tapeout project information
project:
  title:        "NUAT Labs I2C Controller"
  author:       "NUAT Labs"
  discord:      ""
  description:  "I2C Master Controller supporting open-drain I/O, addressing, ACK/NACK, clock stretching, and arbitration loss."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nuatlabs_i2c"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DATA_IN[0] / NACK_BIT"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7] / STATUS_SEL"

  # Outputs
  uo[0]: "DATA_OUT[0] / STATE[0]"
  uo[1]: "DATA_OUT[1] / STATE[1]"
  uo[2]: "DATA_OUT[2] / STATE[2]"
  uo[3]: "DATA_OUT[3] / STATE[3]"
  uo[4]: "DATA_OUT[4] / RX_ACK"
  uo[5]: "DATA_OUT[5] / ACK_ERROR"
  uo[6]: "DATA_OUT[6] / ARB_LOST"
  uo[7]: "DATA_OUT[7] / BUS_ACTIVE"

  # Bidirectional pins
  uio[0]: "I2C_SCL (Open-Drain)"
  uio[1]: "I2C_SDA (Open-Drain)"
  uio[2]: "CMD_START"
  uio[3]: "CMD_READ"
  uio[4]: "CMD_STOP"
  uio[5]: "CMD_VALID"
  uio[6]: "BUSY (Output)"
  uio[7]: "IRQ_DONE (Output)"

# Do not change!
yaml_version: 6
